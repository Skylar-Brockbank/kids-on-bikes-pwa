<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Character Roster</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; color: #fff; font-size: 1.75rem; }
    .btn-create {
      background: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .btn-create:hover { background: #2563eb; }

    /* Character List */
    .character-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #3b82f6; }
    .card-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .card-title-row { display: flex; align-items: center; gap: 0.5rem; }
    .card-name { font-size: 1.15rem; font-weight: bold; color: #fff; }
    .class-badge {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .card-stats { color: #888; font-size: 0.85rem; }
    .card-actions { display: flex; gap: 0.5rem; }
    .btn-icon {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #aaa;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-icon:hover { color: #fff; border-color: #555; }
    .btn-delete:hover { color: #ef4444; border-color: #ef4444; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal h3 { margin: 0; color: #fff; }
    .modal label { font-size: 0.85rem; color: #aaa; }
    .modal input, .modal select, .modal textarea {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #fff;
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-save { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #374151; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }

    /* Modal Skill List Styles */
    .modal-skills-box {
      background: #252525;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .modal-skill-row {
      display: flex;
      gap: 0.5rem;
    }
    .modal-skill-row select { flex: 1; }
    .skill-tag-modal {
      background: #1a1a1a;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .btn-remove-sm {
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
    }
    .empty-state { text-align: center; color: #666; margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <h1>Roster</h1>
    <a href="form" class="btn-create">+ Create</a>
  </header>

  <div id="characterList" class="character-list"></div>

  <div id="editModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Edit Character</h3>
      <form id="editForm">
        <input type="hidden" id="editCharId">

        <label for="editName">Name</label>
        <input type="text" id="editName" required>

        <div class="grid-2col">
          <div>
            <label for="editClass">Class</label>
            <select id="editClass">
              <option value="">-- None --</option>
            </select>
          </div>
          <div>
            <label for="editTokens">Adversity Tokens</label>
            <input type="number" id="editTokens" min="0" required>
          </div>
        </div>

        <label>Stats</label>
        <div class="grid-2col">
          <div>
            <label for="editBrain">Brain</label>
            <select id="editBrain" class="edit-rank-select" required></select>
          </div>
          <div>
            <label for="editBrawn">Brawn</label>
            <select id="editBrawn" class="edit-rank-select" required></select>
          </div>
          <div>
            <label for="editFight">Fight</label>
            <select id="editFight" class="edit-rank-select" required></select>
          </div>
          <div>
            <label for="editFlight">Flight</label>
            <select id="editFlight" class="edit-rank-select" required></select>
          </div>
          <div>
            <label for="editGrit">Grit</label>
            <select id="editGrit" class="edit-rank-select" required></select>
          </div>
          <div>
            <label for="editCharm">Charm</label>
            <select id="editCharm" class="edit-rank-select" required></select>
          </div>
        </div>

        <label>Skills</label>
        <div class="modal-skills-box">
          <div class="modal-skill-row">
            <select id="editSkillSelect">
              <option value="">-- Add Skill --</option>
            </select>
            <button type="button" id="editAddSkillBtn" class="btn-icon" style="white-space: nowrap;" disabled>+ Add</button>
          </div>
          <div id="editSkillsList" style="display: flex; flex-direction: column; gap: 0.35rem;"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
